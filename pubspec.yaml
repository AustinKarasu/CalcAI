publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  speech_to_text: ^7.3.0
  url_launcher: ^6.3.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
